    <style>
        body { margin: 0; overflow: hidden; font-family: "Courier New", monospace; background: #000; }
        canvas.a-canvas { touch-action: none; }
        #visor-foto-overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(6, 7, 10, 0.90); z-index: 30;
        }
        #visor-foto-overlay.activo { display: flex; }
        #visor-foto-panel {
            width: min(82vw, 760px); background: #0d1016; color: #d8dbe2; border: 3px solid #8e95a3;
            box-shadow: 0 0 0 2px #2c3441 inset, 0 12px 32px rgba(0,0,0,0.7); padding: 16px 16px 12px;
        }
        #visor-foto-cabecera {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
        }
        #visor-foto-titulo { color: #f3f4f7; }
        #visor-foto-cerrar {
            background: #1d2530; color: #f3f4f7; border: 1px solid #7f8795; padding: 5px 10px; cursor: pointer;
            font-family: inherit; text-transform: uppercase;
        }
        #visor-foto-marco {
            border: 2px solid #c6cad3; background: #11151d; padding: 10px; display: flex; justify-content: center;
        }
        #visor-foto-imagen { max-width: 100%; max-height: 72vh; object-fit: contain; display: block; }
        #visor-foto-pie { margin-top: 10px; font-size: 13px; color: #b8becc; }
        #visor-foto-documento { display:none; color:#e0dacc; background:#262824; font-size:clamp(15px,2vw,21px); line-height:1.7; padding:22px; margin: 0; min-height:160px; white-space:pre-line; }
        #visor-foto-panel { max-height:90vh; overflow-y:auto; }
        #mensaje-caduco {position:fixed;left:50%;bottom:7%;transform:translateX(-50%); max-width:min(620px,84vw);display:none;padding:13px 22px;background:rgba(12,16,23,.92);border:1px solid #9ea4af;color:#e8ebf1;font:16px 'Courier New',monospace;text-align:center;letter-spacing:.4px;pointer-events:none;z-index:40;}
        #mensaje-caduco.activo{display:block;}

        #pov-entrar, #pov-salir { display: none !important; }
        #pov-hud { display: none; position: fixed; inset: 0; z-index: 12; pointer-events: none; }
        body.modo-pov #pov-hud { display: block; }
        #pov-ayuda {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            right: 16px;
            max-width: min(52vw, 390px);
            padding: 8px 12px;
            border: 1px solid rgba(174, 185, 196, .65);
            background: rgba(11, 17, 25, .77);
            color: #D5DFE9;
            font: 12px/1.5 "Courier New", monospace;
            text-align: right;
            pointer-events: none;
        }
        #pov-movil { display: none; }
        @media (hover: none), (pointer: coarse) {
            #pov-ayuda {
                top: max(14px, env(safe-area-inset-top));
                right: 10px;
                max-width: 210px;
                font-size: 11px;
            }
            body.modo-pov #pov-movil {
                display: grid;
                grid-template-columns: 49px 49px 49px;
                grid-template-rows: 49px 49px;
                gap: 5px;
                position: absolute;
                left: max(16px, env(safe-area-inset-left));
                bottom: max(18px, env(safe-area-inset-bottom));
                pointer-events: auto;
                touch-action: none;
            }
            .pov-flecha {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 49px;
                height: 49px;
                padding: 0;
                border: 1px solid rgba(229, 232, 238, .68);
                border-radius: 9px;
                font: bold 22px/1 "Courier New", monospace;
                color: #E4E7ED;
                background: rgba(15, 20, 30, .67);
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }
            .pov-flecha:active { background: rgba(89, 107, 131, .86); }
            #pov-movil button[data-pov-direccion="adelante"] { grid-column: 2; grid-row: 1; }
            #pov-movil button[data-pov-direccion="izquierda"] { grid-column: 1; grid-row: 2; }
            #pov-movil button[data-pov-direccion="atras"] { grid-column: 2; grid-row: 2; }
            #pov-movil button[data-pov-direccion="derecha"] { grid-column: 3; grid-row: 2; }
            body.modo-pov #mensaje-caduco { bottom: 30%; max-width: 78vw; font-size: 13px; }
        }
        @media (max-width: 370px) {
            #pov-ayuda { max-width: 180px; }
        }
    </style>
